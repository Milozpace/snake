syntax = "proto3";

package snake;

option csharp_namespace = "SnakeNetwork.Protocol";

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_UP          = 1;
  DIRECTION_DOWN        = 2;
  DIRECTION_LEFT        = 3;
  DIRECTION_RIGHT       = 4;
}

message PlayerInput{
  int32     play_id   = 1;
  Direction direction = 2;
  bool      boost     = 3;
}

